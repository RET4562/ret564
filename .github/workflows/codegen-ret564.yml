# MemberJunction CodeGen Workflow for ret564
# Auto-generated by MJ Central - triggers after HotGlue data sync completes
# Uses MJ CLI v3.4.0 for soft PK/FK constraint support (additionalSchemaInfo)

name: CodeGen - ret564 (MJ v3.4.0)

on:
  # Trigger on config file changes (pushed by MJ Central after HotGlue sync)
  push:
    branches:
      - main
    paths:
      - 'config/database-metadata-config.json'
      - 'mj.config.cjs'

  # Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment suffix (e.g., DEV, STAGE, PROD)'
        required: true
        default: 'DEV'
        type: choice
        options:
          - DEV
          - STAGE
          - PROD

permissions:
  contents: write

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Determine environment
        id: env
        run: |
          # Use input if workflow_dispatch, otherwise default to DEV
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="DEV"
          fi
          echo "BRANCH_ENV=$ENV" >> $GITHUB_OUTPUT
          echo "Using environment: $ENV"

      - name: Set database connection info
        id: db
        run: |
          # Get environment-suffixed database secrets (provisioned by MJ Central)
          DB_HOST="${{ secrets[format('DB_HOST_{0}', steps.env.outputs.BRANCH_ENV)] }}"
          DB_DATABASE="${{ secrets[format('DB_DATABASE_{0}', steps.env.outputs.BRANCH_ENV)] }}"
          DB_USERNAME="${{ secrets[format('DB_USERNAME_{0}', steps.env.outputs.BRANCH_ENV)] }}"
          DB_PASSWORD="${{ secrets[format('DB_PASSWORD_{0}', steps.env.outputs.BRANCH_ENV)] }}"

          # Validate secrets exist
          if [ -z "$DB_HOST" ] || [ -z "$DB_DATABASE" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::Missing database secrets for environment ${{ steps.env.outputs.BRANCH_ENV }}"
            echo "Expected secrets: DB_HOST_${{ steps.env.outputs.BRANCH_ENV }}, DB_DATABASE_${{ steps.env.outputs.BRANCH_ENV }}, DB_USERNAME_${{ steps.env.outputs.BRANCH_ENV }}, DB_PASSWORD_${{ steps.env.outputs.BRANCH_ENV }}"
            exit 1
          fi

          echo "Database connection configured"
          echo "  Host: $DB_HOST"
          echo "  Database: $DB_DATABASE"

          # Mask sensitive values
          echo "::add-mask::$DB_PASSWORD"

          # Export as outputs
          echo "host=$DB_HOST" >> $GITHUB_OUTPUT
          echo "port=1433" >> $GITHUB_OUTPUT
          echo "database=$DB_DATABASE" >> $GITHUB_OUTPUT
          echo "username=$DB_USERNAME" >> $GITHUB_OUTPUT
          echo "password=$DB_PASSWORD" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      
      - name: Install SQL Server tools (sqlcmd)
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          sudo add-apt-repository "$(curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list)"
          sudo apt-get update
          sudo apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> \$GITHUB_PATH

        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run MemberJunction CodeGen v3.4.0
        run: |
          echo "=== Running MJ CodeGen v3.4.0 ==="
          echo "Using additionalSchemaInfo for soft PK/FK constraints"
          echo ""
          npx @memberjunction/cli@${mjCliVersion} codegen
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          DB_PORT: ${{ steps.db.outputs.port }}
          DB_DATABASE: ${{ steps.db.outputs.database }}
          DB_USERNAME: ${{ steps.db.outputs.username }}
          DB_PASSWORD: ${{ steps.db.outputs.password }}
          CODEGEN_DB_USERNAME: ${{ steps.db.outputs.username }}
          CODEGEN_DB_PASSWORD: ${{ steps.db.outputs.password }}
          MJ_CORE_SCHEMA: __mj

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit generated files
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config user.name "MJ Central Bot"
          git config user.email "bot@mjcentral.dev"

          # Add generated directories
          git add packages/GeneratedEntities/src/generated/ || true
          git add packages/GeneratedActions/src/generated/ || true
          git add apps/MJAPI/src/generated/ || true
          git add apps/MJExplorer/src/app/generated/ || true
          git add apps/MJAPI/schema.graphql || true

          git commit -m "chore: regenerate entities with soft PK/FK metadata


      - name: Push changes
        if: steps.git-check.outputs.changes == 'true'
        run: git push origin main

      - name: Summary
        run: |
          echo "### CodeGen Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tenant**: ret564" >> $GITHUB_STEP_SUMMARY
          echo "- **MJ CLI Version**: 3.4.0" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ steps.env.outputs.BRANCH_ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes committed**: ${{ steps.git-check.outputs.changes == 'true' && 'Yes' || 'No' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow used additionalSchemaInfo for soft PK/FK constraint detection." >> $GITHUB_STEP_SUMMARY
